      -webkit-font-smoothing: antialiased;

      --sgte-primary-strong: #b7decf;

    .card,

    }

      color: var(--sgte-text-muted);

    }

    table {

      border-collapse: separate;
      border-spacing: 0;
    }
    table thead { background: var(--sgte-surface-soft); }

/* codex-school-community-ux: ajustes finos para uso recorrente por comunidade escolar */

<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

  <script>
    (function() {
      const commands = [
        { label: "Dashboard", description: "Visão geral da operação", icon: "space_dashboard", route: "dashboard" },
        { label: "Estudantes", description: "Cadastros e vínculos", icon: "school", route: "StudentList" },
        { label: "Rotas", description: "Planejamento e capacidade", icon: "alt_route", route: "RouteList" },
        { label: "Veículos", description: "Frota e manutenção", icon: "directions_bus", route: "VehicleList" },
        { label: "Motoristas", description: "Equipe de condução", icon: "badge", route: "DriverList" },
        { label: "Escolas", description: "Unidades atendidas", icon: "account_balance", route: "SchoolList" },
        { label: "Viagens", description: "Execução operacional", icon: "route", route: "TripList" },
        { label: "Monitoramento", description: "Acompanhamento de rotas", icon: "location_searching", route: "RouteMonitoring" },
        { label: "Registrar não embarque", description: "Aviso rápido da família", icon: "person_off", route: "NonBoardingNoticeForm" },
        { label: "Otimização de rotas", description: "Resultados e ganhos", icon: "auto_awesome", route: "RouteOptimizationReport" },
        { label: "Relatórios", description: "Indicadores e exportações", icon: "insights", route: "ReportList" },
        { label: "Meu perfil", description: "Dados e preferências", icon: "account_circle", route: "UserProfile" },
        { label: "Configurações", description: "Administração do SGTE", icon: "settings", route: "Settings", adminOnly: true }
      ];

      let filteredCommands = commands.slice();
      let selectedCommand = 0;

      function navigate(route, parameters) {
        const routeParts = String(route || "dashboard").split("?");
        const query = new URLSearchParams(routeParts.slice(1).join("?"));
        Object.entries(parameters || {}).forEach(function(entry) {
          query.set(entry[0], entry[1]);
        });
        query.set("action", routeParts[0]);
        (function(url) { var a = document.createElement('a'); a.href = url; a.target = '_top'; document.body.appendChild(a); a.click(); })(`${window.SGTE_CONFIG.scriptUrl}?${query.toString()}`);
      }

      function logout() {
        CrLoader.show("Encerrando sessão...");
        ApiClient.call("AuthService", "logout", {}, { loading: false })
          .then(function() {
            (function(url) { var a = document.createElement('a'); a.href = url; a.target = '_top'; document.body.appendChild(a); a.click(); })(`${window.SGTE_CONFIG.scriptUrl}?action=login`);
          })
          .catch(function(logoutError) {
            CrAlert.error(logoutError.message);
          })
          .finally(function() {
            CrLoader.hide();
          });
      }

      function applyTheme(theme) {
        document.body.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        localStorage.setItem("sgte-theme", theme);
        document.querySelectorAll("[data-theme-icon]").forEach(function(icon) {
          icon.textContent = theme === "dark" ? "light_mode" : "dark_mode";
        });
      }

      function toggleTheme() {
        applyTheme(document.body.dataset.theme === "dark" ? "light" : "dark");
      }

      function availableCommands() {
        const user = window.SGTE_CONFIG.currentUser || {};
        const isAdmin = String(user.Role || "").toLowerCase() === "admin";
        return commands.filter(function(command) {
          return !command.adminOnly || isAdmin;
        });
      }

      function renderCommands() {
        const results = document.getElementById("sgte-command-results");
        results.replaceChildren();

        if (!filteredCommands.length) {
          const empty = document.createElement("div");
          empty.className = "sgte-command-empty";
          empty.textContent = "Nenhuma página encontrada.";
          results.appendChild(empty);
          return;
        }

        filteredCommands.forEach(function(command, index) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "sgte-command-item" + (index === selectedCommand ? " is-selected" : "");
          button.dataset.index = index;
          button.innerHTML =
            '<i class="material-icons" aria-hidden="true">' + command.icon + "</i>" +
            '<span class="sgte-command-copy"><strong></strong><span></span></span>';
          button.querySelector("strong").textContent = command.label;
          button.querySelector(".sgte-command-copy span").textContent = command.description;
          button.addEventListener("click", function() {
            navigate(command.route);
          });
          results.appendChild(button);
        });
      }

      function openCommandPalette() {
        const palette = document.getElementById("sgte-command-palette");
        const input = document.getElementById("sgte-command-input");
        filteredCommands = availableCommands();
        selectedCommand = 0;
        input.value = "";
        renderCommands();
        palette.hidden = false;
        window.setTimeout(function() { input.focus(); }, 20);
      }

      function closeCommandPalette() {
        document.getElementById("sgte-command-palette").hidden = true;
      }

      window.CrApp = {
        navigate: navigate,
        logout: logout,
        toggleTheme: toggleTheme,
        openCommandPalette: openCommandPalette,
        closeCommandPalette: closeCommandPalette
      };
      window.navigateTo = navigate;
      window.logout = logout;

      document.addEventListener("DOMContentLoaded", function() {
        const storedTheme = localStorage.getItem("sgte-theme");
        const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        applyTheme(storedTheme || preferredTheme);

        M.Sidenav.init(document.querySelectorAll(".sidenav"));
        M.FormSelect.init(document.querySelectorAll("select"));
        M.Modal.init(document.querySelectorAll(".modal"));

        const palette = document.getElementById("sgte-command-palette");
        const input = document.getElementById("sgte-command-input");

        palette.addEventListener("click", function(event) {
          if (event.target === palette) closeCommandPalette();
        });

        input.addEventListener("input", function() {
          const query = input.value.trim().toLocaleLowerCase("pt-BR");
          filteredCommands = availableCommands().filter(function(command) {
            return (command.label + " " + command.description).toLocaleLowerCase("pt-BR").includes(query);
          });
          selectedCommand = 0;
          renderCommands();
        });

        document.addEventListener("keydown", function(event) {
          const isShortcut = (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k";
          if (isShortcut) {
            event.preventDefault();
            palette.hidden ? openCommandPalette() : closeCommandPalette();
            return;
          }

          if (palette.hidden) return;
          if (event.key === "Escape") {
            closeCommandPalette();
          } else if (event.key === "ArrowDown") {
            event.preventDefault();
            selectedCommand = Math.min(selectedCommand + 1, filteredCommands.length - 1);
            renderCommands();
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            selectedCommand = Math.max(selectedCommand - 1, 0);
            renderCommands();
          } else if (event.key === "Enter" && filteredCommands[selectedCommand]) {
            navigate(filteredCommands[selectedCommand].route);
          }
        });
      });
    })();
  </script>

<script>
/* codex-school-community-ux-script: pequenos ajustes de contexto escolar */
(function() {
  if (window.__codexSchoolCommunityUx) return;
  window.__codexSchoolCommunityUx = true;

  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true });
    else fn();
  }

  ready(function() {
    document.documentElement.setAttribute('data-community-context', 'school');

    document.querySelectorAll('form').forEach(function(form) {
      if (!form.getAttribute('aria-label') && !form.getAttribute('aria-labelledby')) {
        form.setAttribute('aria-label', 'Formulario da comunidade escolar');
      }
    });

    document.querySelectorAll('input, select, textarea').forEach(function(field) {
      if (!field.id && field.name) field.id = 'field-' + String(field.name).replace(/[^a-zA-Z0-9_-]/g, '-');
      if (field.required && !field.getAttribute('aria-required')) field.setAttribute('aria-required', 'true');
      if (!field.getAttribute('autocomplete')) {
        var type = (field.getAttribute('type') || '').toLowerCase();
        var name = (field.getAttribute('name') || field.id || '').toLowerCase();
        if (type === 'email' || name.indexOf('email') >= 0) field.setAttribute('autocomplete', 'email');
        else if (name.indexOf('nome') >= 0 || name.indexOf('name') >= 0) field.setAttribute('autocomplete', 'name');
        else if (name.indexOf('senha') >= 0 || name.indexOf('password') >= 0) field.setAttribute('autocomplete', 'current-password');
      }
    });

    document.querySelectorAll('button:not([type])').forEach(function(button) {
      button.setAttribute('type', 'button');
    });
  });
})();
</script>

<script>
/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {
      delete button.dataset.codexSubmitLocked;
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
  }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {
      event.preventDefault();
      return;
    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.codexSubmitting = 'true';
    form.setAttribute('aria-busy', 'true');

    var button = event.submitter || form.querySelector('button[type="submit"], input[type="submit"], button:not([type])');
    if (isElement(button) && !button.disabled && !button.hasAttribute('data-no-submit-lock')) {
      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);
  }, true);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {
      invalidFocusPending = false;
      if (!document.documentElement.contains(field)) return;
      try {
        field.scrollIntoView({ block: 'center', inline: 'nearest', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
        field.focus({ preventScroll: true });
      } catch (error) {
        field.focus();
      }
    }, 0);
  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
